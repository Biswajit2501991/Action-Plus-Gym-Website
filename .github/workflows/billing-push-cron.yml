# Daily billing-day Web Push (India morning ≈ 08:00 IST).
# Required GitHub secrets:
#   MEMBER_PORTAL_SITE_URL   e.g. https://actionplusgym.com
#   MEMBER_PORTAL_CRON_SECRET  same value as Railway MEMBER_PORTAL_CRON_SECRET
name: Billing push cron

on:
  schedule:
    # 02:30 UTC = 08:00 India Standard Time
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  billing-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send billing-day push
        env:
          SITE_URL: ${{ secrets.MEMBER_PORTAL_SITE_URL }}
          CRON_SECRET: ${{ secrets.MEMBER_PORTAL_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing MEMBER_PORTAL_SITE_URL or MEMBER_PORTAL_CRON_SECRET secrets."
            exit 1
          fi
          BASE="${SITE_URL%/}"
          curl -fsS -X POST "${BASE}/api/member/push/billing-cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json"
