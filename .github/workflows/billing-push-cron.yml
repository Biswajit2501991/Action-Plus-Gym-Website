# Hourly at :30 UTC (= every IST hour at :00). Sends only when
# member_portal_settings.billing_push_hour_ist matches current IST hour.
# Required GitHub secrets:
#   MEMBER_PORTAL_SITE_URL   e.g. https://actionplusgym.com
#   MEMBER_PORTAL_CRON_SECRET  same value as Railway MEMBER_PORTAL_CRON_SECRET
name: Billing push cron

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  billing-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send billing / overdue push
        env:
          SITE_URL: ${{ secrets.MEMBER_PORTAL_SITE_URL }}
          CRON_SECRET: ${{ secrets.MEMBER_PORTAL_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing MEMBER_PORTAL_SITE_URL or MEMBER_PORTAL_CRON_SECRET secrets."
            exit 1
          fi
          BASE="${SITE_URL%/}"
          curl -fsS -X POST "${BASE}/api/member/push/billing-cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json"
