# Every 5 minutes — process due scheduled owner Web Push broadcasts.
# Separate from billing-push-cron (does not use billing_push_hour_ist).
# Required GitHub secrets:
#   MEMBER_PORTAL_SITE_URL
#   MEMBER_PORTAL_CRON_SECRET
name: Scheduled broadcast cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  broadcast-due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due scheduled broadcasts
        env:
          SITE_URL: ${{ secrets.MEMBER_PORTAL_SITE_URL }}
          CRON_SECRET: ${{ secrets.MEMBER_PORTAL_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing MEMBER_PORTAL_SITE_URL or MEMBER_PORTAL_CRON_SECRET secrets."
            exit 1
          fi
          BASE="${SITE_URL%/}"
          curl -fsS -X POST "${BASE}/api/member/push/broadcast-due" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json"
